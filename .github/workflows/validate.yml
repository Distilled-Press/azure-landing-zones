name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive chapters
      - name: validate each Terraform folder
        run: |
          set -e
          for d in $(find chapters -name '*.tf' -printf '%h\n' | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build each Bicep file
        run: |
          set -e
          az bicep install
          for f in $(find chapters -name 'main.bicep'); do
            echo "::group::$f"
            az bicep build --file "$f" --stdout > /dev/null
            echo "::endgroup::"
          done

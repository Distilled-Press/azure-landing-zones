# Scheduled drift check for chapter 15's Bicep (the brownfield resources
# adopted into a deployment stack). Copy to .github/workflows/drift-bicep.yml.
#
# It runs a subscription-scope what-if of bicep/main.bicep with the read-only
# identity from chapter 13 (OIDC, no secrets) and treats any Create, Delete or
# Modify as drift: opens an issue, or comments on the open one; closes it when
# what-if is clean again.
#
# what-if needs Microsoft.Resources/deployments/* as well as read access, which
# Reader doesn't have: assign the custom role in drift/whatif-reader-role.json
# to the plan identity on the subscription (see the README). With
# --validation-level ProviderNoRbac, what-if then only checks read access to
# the resources themselves.
#
# Repository variables: AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_CLIENT_ID_PLAN, and optionally BROWNFIELD_SUBSCRIPTION_ID and
# BROWNFIELD_LOCATION (default uksouth).

name: drift-bicep

on:
  schedule:
    - cron: "23 6 * * 1-5" # 06:23 UTC, Monday to Friday
  workflow_dispatch:

permissions: {}

concurrency:
  group: drift-bicep
  cancel-in-progress: false

env:
  BICEP_ROOT: chapters/15-brownfield-day-two/bicep
  LOCATION: ${{ vars.BROWNFIELD_LOCATION || 'uksouth' }}
  ISSUE_TITLE: "Drift detected: chapters/15-brownfield-day-two/bicep"

jobs:
  drift:
    name: Bicep what-if drift check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ${{ env.BICEP_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC, plan identity)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.BROWNFIELD_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      # ResourceIdOnly can't show drift: for resources that exist and are in the
      # template it reports "Deploy" (it doesn't compare properties). The full
      # result format compares properties and reports Modify for differences.
      - name: What-if (detect drift)
        id: whatif
        run: |
          az bicep install
          az deployment sub what-if \
            --location "$LOCATION" \
            --name "drift-${GITHUB_RUN_ID}" \
            --parameters main.bicepparam location="$LOCATION" \
            --validation-level ProviderNoRbac \
            --result-format FullResourcePayloads \
            --no-pretty-print --output json > whatif.json

          # Everything except NoChange and Ignore is a difference, apart from a
          # Modify whose property changes are all NoEffect (values the resource
          # provider ignores, such as read-only properties).
          jq '[.changes[]
                | select(.changeType != "NoChange" and .changeType != "Ignore")
                | select(.changeType != "Modify" or ([.delta[]? | select(.propertyChangeType != "NoEffect")] | length > 0))]' \
            whatif.json > drift.json
          count=$(jq 'length' drift.json)

          # A readable summary: change type, resource ID, then each changed property
          # (and, for an Array change such as an added NSG rule, each changed item).
          jq -r '.[] | "\(.changeType)  \(.resourceId)",
            (.delta // [] | .[] | "    \(.propertyChangeType)  \(.path): \(.before // "" | tostring) => \(.after // "" | tostring)",
              (.children // [] | .[] | "      \(.propertyChangeType)  [\(.path)]: \(.before // "" | tostring) => \(.after // "" | tostring)"))' \
            drift.json > drift.txt
          cat drift.txt

          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "::warning::Drift detected: $count resource(s) differ from the template"
          fi

      - name: Upload the what-if result
        if: steps.whatif.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: drift-whatif
          path: |
            ${{ env.BICEP_ROOT }}/whatif.json
            ${{ env.BICEP_ROOT }}/drift.txt
          retention-days: 30

      - name: Open, update or close the drift issue
        uses: actions/github-script@v9
        env:
          DRIFT_COUNT: ${{ steps.whatif.outputs.count }}
          SUMMARY_FILE: ${{ env.BICEP_ROOT }}/drift.txt
        with:
          script: |
            const fs = require('fs');
            const title = process.env.ISSUE_TITLE;
            const drift = process.env.DRIFT_COUNT !== '0';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && i.title === title);

            if (!drift) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: `No drift any more (what-if clean). Closing. Run: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  state: 'closed', state_reason: 'completed',
                });
              }
              core.info('No drift.');
              return;
            }

            let summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8');
            const max = 60000;
            if (summary.length > max) {
              summary = summary.substring(0, max) + '\n... (cut; the full result is in the drift-whatif artifact)';
            }
            const body = [
              `Scheduled what-if found ${process.env.DRIFT_COUNT} resource(s) that differ from \`bicep/main.bicep\`.`,
              '',
              'Check for what-if noise (properties Azure sets that the template doesn\'t) before acting.',
              'A wanted change goes into the template by pull request; an unwanted one is reverted by redeploying the stack.',
              '',
              '```',
              summary,
              '```',
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
              core.warning(`Drift: commented on issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
              core.warning(`Drift: opened issue #${created.data.number}`);
            }
